# 前端经 nginx 同域代理后端，避免跨域问题
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # 前端路由：全部回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后端 API 与上传文件代理
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }
    location /uploads/ {
        proxy_pass http://backend:8000;
    }
}
