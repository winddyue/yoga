# yoga 线上 nginx 配置 —— 域名 zytzml.cn
#
# 用法（服务器 Ubuntu，43.128.26.65）：
#   sudo cp deploy/nginx/zytzml.conf /etc/nginx/sites-available/yoga
#   sudo ln -sf /etc/nginx/sites-available/yoga /etc/nginx/sites-enabled/yoga
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# 前置条件：
#   1. DNS 已解析：api.zytzml.cn → 43.128.26.65，www.zytzml.cn → 43.128.26.65
#   2. 证书已签发（三个域名一张证书，固定目录 live/zytzml.cn）：
#      sudo certbot certonly --webroot -w /var/www/html --cert-name zytzml.cn \
#           -d zytzml.cn -d api.zytzml.cn -d www.zytzml.cn
#      注意：本文件写死了证书目录 live/zytzml.cn，若证书是另外签的
#      （目录名变成 live/api.zytzml.cn 之类），要同步改下面两处 ssl_certificate。
#   3. 后端在 127.0.0.1:8000 运行（systemd 或 docker 均可）
#   4. Web 管理端已构建到 /var/www/yoga-admin（见 docs/deployment.md）

# ---------- HTTP：证书签发用的 ACME 验证 + 全部跳转 HTTPS ----------
server {
    listen 80;
    listen [::]:80;
    server_name api.zytzml.cn www.zytzml.cn zytzml.cn;

    # certbot 的 HTTP-01 验证必须放行，否则续期会失败
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------- 接口域名：小程序用 ----------
server {
    listen 443 ssl;
    http2 on;
    server_name api.zytzml.cn;

    # 三个域名共用一张证书（certbot --cert-name zytzml.cn -d zytzml.cn -d api... -d www...）
    ssl_certificate     /etc/letsencrypt/live/zytzml.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zytzml.cn/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;   # 微信要求 ≥ TLS 1.2
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;

    # 上传体积上限（与后端 MAX_UPLOAD_BYTES 保持一致，默认 10MB）
    client_max_body_size 10m;

    # 接口与上传/下载全部走后端，前端不参与
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 扫码签到等请求较短，超时放宽到 60s（微信侧默认也是 60s）
        proxy_read_timeout 60s;
    }

    # 健康检查不记日志，避免被探活刷爆
    location = /api/health {
        proxy_pass http://127.0.0.1:8000;
        access_log off;
    }
}

# ---------- Web 管理端（馆主/教练用）----------
server {
    listen 443 ssl;
    http2 on;
    server_name www.zytzml.cn zytzml.cn;

    ssl_certificate     /etc/letsencrypt/live/zytzml.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zytzml.cn/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;

    root /var/www/yoga-admin;
    index index.html;

    # 前端单页路由：找不到文件时回退 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 管理端也走同一套接口（跨域已在后端白名单放开 www.zytzml.cn）
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 10m;
    }

    location /uploads/ {
        proxy_pass http://127.0.0.1:8000;
    }
}
