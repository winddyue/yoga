# Alembic config: database migrations. Run from the backend/ directory.
#
#   alembic upgrade head          # upgrade to latest
#   alembic downgrade -1          # roll back one revision
#   alembic revision --autogenerate -m "desc"   # generate a new revision
#
# The connection string comes from DATABASE_URL (shared with app/config.py).
#
# IMPORTANT: this file must stay pure ASCII. Python's configparser reads ini
# files with encoding="locale" (see alembic/util/compat.py), which is GBK on
# a Chinese Windows - any CJK byte here raises UnicodeDecodeError and breaks
# "alembic upgrade head". Chinese docs belong in alembic/env.py instead.

[alembic]
script_location = alembic
prepend_sys_path = .

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
