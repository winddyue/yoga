# Alembic 配置：数据库迁移。用法（在 backend/ 目录下执行）：
#
#   alembic upgrade head          # 升级到最新（生产库改表结构后执行）
#   alembic downgrade -1          # 回滚一个版本
#   alembic revision --autogenerate -m "描述"   # models.py 改动后生成新迁移
#
# 数据库连接串默认读取环境变量 DATABASE_URL（与 app 共用 app/config.py），
# 也可用 -x 或直接改 sqlalchemy.url 覆盖。
# 注意：SQLite 的 ALTER 支持有限，复杂改表请用 batch 模式（见 env.py）。

[alembic]
script_location = alembic
prepend_sys_path = .

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
